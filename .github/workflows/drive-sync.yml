name: Sync Code to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - '*.js'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone and Sync
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_CREDENTIALS" > sa.json
          
          cat <<RCLONE_EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = sa.json
          root_folder_id = 1mxmLCbIEepp6XJyhzZxVzBTYCcKJI6CW
          RCLONE_EOF
          
          if [ -f index.js ]; then
            rclone copyto index.js gdrive:index.js --verbose
          fi
          if [ -f keyboards.js ]; then
            rclone copyto keyboards.js gdrive:keyboards.js --verbose
          fi
          if [ -f telegram.js ]; then
            rclone copyto telegram.js gdrive:telegram.js --verbose
          fi
          
          rm -f sa.json
