name: Sync Code to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Setup Credentials & Sync
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/rclone
          python3 -c "
          import os, json
          raw = os.environ['GOOGLE_CREDENTIALS']
          try:
              data = json.loads(raw)
          except Exception:
              data = json.loads(raw.replace('\n', '\\\\n'))
          open('sa.json','w').write(json.dumps(data))
          "
          cat <<RCLONE_EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = sa.json
          root_folder_id = 1mxmLCbIEepp6XJyhzZxVzBTYCcKJI6CW
          RCLONE_EOF
          [ -f index.js ] && rclone copyto index.js gdrive:index.js --verbose
          [ -f keyboards.js ] && rclone copyto keyboards.js gdrive:keyboards.js --verbose
          [ -f telegram.js ] && rclone copyto telegram.js gdrive:telegram.js --verbose
          rm -f sa.json
