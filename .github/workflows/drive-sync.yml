name: Sync Code to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - '*.js'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure Rclone & Sync Files
        run: |
          mkdir -p ~/.config/rclone
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > sa.json
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = sa.json
          root_folder_id = 1mxmLCbIEepp6XJyhzZxVzBTYCcKJI6CW
          EOF
          [ -f index.js ] && rclone copyto index.js gdrive:index.js --verbose
          [ -f keyboards.js ] && rclone copyto keyboards.js gdrive:keyboards.js --verbose
          [ -f telegram.js ] && rclone copyto telegram.js gdrive:telegram.js --verbose
          rm -f sa.json
